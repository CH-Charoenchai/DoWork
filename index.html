<script>

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhd2lyYnJqY212bXRubW56aGxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDE2MzAsImV4cCI6MjEwMjUxNzYzMH0.4qsbaq4ViJaW-3dP0IXA-MEqEl_ELob-cgTAQX3IHfw";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }

let currentUser = null;
let tasksCache = [];
let currentView = 'home';
let isSignupMode = false;
let activeTaskId = null;
let homeRange = 'month'; // month | quarter | all
const DEFAULT_CATEGORIES = ['Project','Meeting','Follow-up','Admin'];
let userCategories = [...DEFAULT_CATEGORIES];
let categoryColors = {};
let userShortcuts = [];
const MAX_SHORTCUTS = 8;
const MAX_ICON_BYTES = 300 * 1024; // 300KB cap on custom uploaded icons
const DEFAULT_CATEGORY_COLORS = { 'Project':'#7C6FFF', 'Meeting':'#FF8FA3', 'Follow-up':'#FFB84D', 'Admin':'#2FBFAE' };
function colorForCategory(cat){
  return categoryColors[cat] || DEFAULT_CATEGORY_COLORS[cat] || '#8A84A0';
}

const URGENCY_COLOR = { 'ด่วนมาก':'var(--coral)', 'ปกติ':'var(--yellow)', 'ไม่ด่วน':'var(--mint)' };
const IMPACT_SIZE = { 'สูง':18, 'กลาง':14, 'ต่ำ':10 };
const STATUS_CLASS = { 'ยังไม่ทำ':'status-todo', 'กำลังทำ':'status-doing', 'เสร็จแล้ว':'status-done' };

// ---------- helpers ----------
function $(sel){ return document.querySelector(sel); }
function $all(sel){ return document.querySelectorAll(sel); }
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
}
function fmtDateTime(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}) + ' ' + dt.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function isOverdue(task){
  if(!task.deadline || task.status === 'เสร็จแล้ว') return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(task.deadline) < today;
}
function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  $('#toast-container').appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
function moodDot(task){
  const size = IMPACT_SIZE[task.impact] || 12;
  const color = colorForCategory(task.category);
  return `<span class="mood-dot" style="width:${size}px;height:${size}px;background:${color};"></span>`;
}

// ---------- AUTH ----------
$('#auth-switch-btn').addEventListener('click', ()=>{
  isSignupMode = !isSignupMode;
  $('#auth-sub').textContent = isSignupMode ? 'สร้างบัญชีใหม่เพื่อเริ่มใช้งาน' : 'เข้าสู่ระบบเพื่อจัดการงานของคุณ';
  $('#auth-submit-btn').textContent = isSignupMode ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
  $('#auth-switch-text').textContent = isSignupMode ? 'มีบัญชีอยู่แล้ว?' : 'ยังไม่มีบัญชี?';
  $('#auth-switch-btn').textContent = isSignupMode ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
  $('#auth-message').innerHTML = '';
});

$('#auth-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = $('#auth-email').value.trim();
  const password = $('#auth-password').value;
  $('#auth-message').innerHTML = '';
  $('#auth-submit-btn').textContent = 'กำลังดำเนินการ...';
  try{
    if(isSignupMode){
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error) throw error;
      if(data.user && !data.session){
        $('#auth-message').innerHTML = `<div class="auth-hint">สมัครสำเร็จ! เช็คอีเมลเพื่อยืนยันบัญชี แล้วกลับมาเข้าสู่ระบบนะคะ</div>`;
        isSignupMode = false;
        $('#auth-sub').textContent = 'เข้าสู่ระบบเพื่อจัดการงานของคุณ';
        $('#auth-submit-btn').textContent = 'เข้าสู่ระบบ';
        $('#auth-switch-text').textContent = 'ยังไม่มีบัญชี?';
        $('#auth-switch-btn').textContent = 'สมัครสมาชิก';
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
    }
  } catch(err){
    $('#auth-message').innerHTML = `<div class="auth-error">${err.message || 'เกิดข้อผิดพลาด ลองใหม่อีกครั้งนะคะ'}</div>`;
  } finally {
    $('#auth-submit-btn').textContent = isSignupMode ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
  }
});

async function handleLogout(){
  await sb.auth.signOut();
}
$('#logout-btn').addEventListener('click', handleLogout);
$('#logout-btn-mobile').addEventListener('click', handleLogout);

// ---------- ICON UPLOAD (shared by shortcuts + task links) ----------
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    r.readAsDataURL(file);
  });
}

let iconUploadCallback = null;
function requestIconUpload(callback){
  iconUploadCallback = callback;
  $('#icon-upload-input').value = '';
  $('#icon-upload-input').click();
}
$('#icon-upload-input').addEventListener('change', async (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('เลือกไฟล์รูปภาพเท่านั้นนะ'); return; }
  if(file.size > MAX_ICON_BYTES){ showToast('ไฟล์ใหญ่เกินไป (จำกัด 300KB)'); return; }
  try{
    const dataUrl = await readFileAsDataURL(file);
    if(iconUploadCallback) iconUploadCallback(dataUrl);
  } catch(err){
    showToast('อัปโหลดไอคอนไม่สำเร็จ');
  }
  iconUploadCallback = null;
});

// ---------- SIDEBAR SHORTCUTS ----------
function shortcutFaviconUrl(url){
  try{
    const host = new URL(url).hostname;
    return `https://www.google.com/s2/favicons?sz=64&domain=${host}`;
  } catch(e){ return ''; }
}

function renderShortcuts(){
  const grid = $('#shortcut-grid');
  if(!grid) return;
  let html = userShortcuts.map((s,i)=>`
    <div class="shortcut-item">
      <a class="shortcut-btn" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(s.label || s.url)}">
        <img src="${escapeHtml(s.icon || shortcutFaviconUrl(s.url))}" alt="" onerror="this.style.display='none'">
      </a>
      <button type="button" class="shortcut-upload" data-idx="${i}" title="อัปโหลดไอคอนเอง">⇧</button>
      <button type="button" class="shortcut-remove" data-idx="${i}" title="ลบ">✕</button>
    </div>
  `).join('');
  if(userShortcuts.length < MAX_SHORTCUTS){
    html += `<button type="button" class="shortcut-btn shortcut-add-btn" id="shortcut-add-btn" title="เพิ่ม shortcut">+</button>`;
  }
  grid.innerHTML = html;

  $all('.shortcut-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      const updated = [...userShortcuts];
      updated.splice(idx, 1);
      saveShortcuts(updated);
    });
  });
  $all('.shortcut-upload').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      requestIconUpload((dataUrl)=>{
        const updated = [...userShortcuts];
        updated[idx] = { ...updated[idx], icon: dataUrl };
        saveShortcuts(updated);
        showToast('อัปเดตไอคอนแล้ว ✓');
      });
    });
  });
  const addBtn = $('#shortcut-add-btn');
  if(addBtn) addBtn.addEventListener('click', showShortcutAddForm);
}

function showShortcutAddForm(){
  $('#shortcut-add-form').classList.remove('hidden');
  $('#shortcut-url-input').value = '';
  $('#shortcut-label-input').value = '';
  $('#shortcut-url-input').focus();
}
function hideShortcutAddForm(){
  $('#shortcut-add-form').classList.add('hidden');
  renderShortcuts();
}
async function saveShortcuts(list){
  userShortcuts = list;
  const { error } = await sb.from('app_settings').update({ shortcuts: list, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id);
  if(error){ showToast('บันทึก shortcut ไม่สำเร็จ: '+error.message); return; }
  renderShortcuts();
}
function addShortcutFromInputs(){
  if(userShortcuts.length >= MAX_SHORTCUTS) return;
  const urlRaw = $('#shortcut-url-input').value.trim();
  const label = $('#shortcut-label-input').value.trim();
  if(!urlRaw) return;
  saveShortcuts([...userShortcuts, { url: normalizeUrl(urlRaw), label }]);
  hideShortcutAddForm();
}
$('#shortcut-add-submit').addEventListener('click', addShortcutFromInputs);
$('#shortcut-add-cancel').addEventListener('click', hideShortcutAddForm);
$('#shortcut-url-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addShortcutFromInputs(); } if(e.key==='Escape'){ e.preventDefault(); hideShortcutAddForm(); } });
$('#shortcut-label-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addShortcutFromInputs(); } if(e.key==='Escape'){ e.preventDefault(); hideShortcutAddForm(); } });

sb.auth.onAuthStateChange((event, session)=>{
  if(session && session.user){
    currentUser = session.user;
    $('#auth-screen').classList.add('hidden');
    $('#app-screen').classList.remove('hidden');
    $('#sidebar-email').textContent = currentUser.email;
    loadSettings();
    loadTasks();
  } else {
    currentUser = null;
    $('#app-screen').classList.add('hidden');
    $('#auth-screen').classList.remove('hidden');
  }
});

function switchView(view){

  $all('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.view===view));

let latestNoteByTask = {};

async function loadTasks(){
  const { data, error } = await sb.from('tasks').select('*').order('sort_order', {ascending:true, nullsFirst:false}).order('created_at', {ascending:true});
  if(error){ showToast('โหลดข้อมูลไม่สำเร็จ: '+error.message); return; }
  tasksCache = data || [];

  const { data: notesData, error: notesErr } = await sb.from('task_notes')
    .select('task_id,content,created_at')
    .order('created_at', {ascending:false});
  latestNoteByTask = {};
  if(!notesErr && notesData){
    notesData.forEach(n=>{
      if(!latestNoteByTask[n.task_id]) latestNoteByTask[n.task_id] = n;
    });
  }

  updateCategoryList();
  if(currentView==='home') renderHome(); else renderWork();
}

function allKnownCategories(){
  const cats = new Set(userCategories);
  tasksCache.forEach(t=>cats.add(t.category));
  return [...cats];
}

function categoryOptionsHtml(selected){
  return allKnownCategories().map(c=>`<option value="${escapeHtml(c)}" ${c===selected?'selected':''}>${escapeHtml(c)}</option>`).join('')
    + `<option value="__new__">+ เพิ่มหมวดหมู่ใหม่...</option>`;
}

function updateCategoryList(){
  const addSel = $('#add-category-select');
  if(addSel){
    const cur = (addSel.value && addSel.value !== '__new__') ? addSel.value : 'Project';
    addSel.innerHTML = categoryOptionsHtml(cur);
  }
  const wf = $('#work-cat-filter');
  if(wf){
    const cur = wf.value;
    wf.innerHTML = `<option value="">ทุกหมวดหมู่</option>` + allKnownCategories().map(c=>`<option value="${escapeHtml(c)}" ${c===cur?'selected':''}>${escapeHtml(c)}</option>`).join('');
  }
}

function wireCategorySelect(selectEl, newInputEl, onFinal){
  selectEl.addEventListener('change', ()=>{
    if(selectEl.value === '__new__'){
      newInputEl.classList.remove('hidden');
      newInputEl.value = '';
      newInputEl.focus();
    } else {
      newInputEl.classList.add('hidden');
      onFinal(selectEl.value);
    }
  });
  newInputEl.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); newInputEl.blur(); }
  });
  newInputEl.addEventListener('blur', async ()=>{
    const val = newInputEl.value.trim();
    if(!val) { selectEl.value = allKnownCategories()[0] || 'Project'; newInputEl.classList.add('hidden'); return; }
    if(!userCategories.includes(val)) await saveCategories([...userCategories, val]);
    onFinal(val, true);
  });
}

async function loadSettings(){
  const { data, error } = await sb.from('app_settings').select('*').eq('user_id', currentUser.id).maybeSingle();
  if(error){ console.error(error); return; }
  if(!data){
    const { data: created, error: insErr } = await sb.from('app_settings').insert({ user_id: currentUser.id, categories: DEFAULT_CATEGORIES, category_colors: DEFAULT_CATEGORY_COLORS, shortcuts: [] }).select().single();
    if(!insErr && created){ userCategories = created.categories; categoryColors = created.category_colors || {}; userShortcuts = created.shortcuts || []; }
  } else {
    userCategories = data.categories && data.categories.length ? data.categories : [...DEFAULT_CATEGORIES];
    categoryColors = data.category_colors || {};
    userShortcuts = data.shortcuts || [];
  }
  updateCategoryList();
  renderShortcuts();
  if(currentView==='settings') renderSettings();
}

async function saveCategories(newList){
  userCategories = newList;
  const { error } = await sb.from('app_settings').update({ categories: newList, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id);
  if(error){ showToast('บันทึกหมวดหมู่ไม่สำเร็จ: '+error.message); return; }
  updateCategoryList();
}
async function saveCategoryColor(cat, color){
  categoryColors = { ...categoryColors, [cat]: color };
  const { error } = await sb.from('app_settings').update({ category_colors: categoryColors, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id);
  if(error){ showToast('บันทึกสีไม่สำเร็จ: '+error.message); return; }
  if(currentView==='work') renderWorkLists();
  else if(currentView==='home') renderHome();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str==null ? '' : str;
  return d.innerHTML;
}

let tmLinks = [];

function normalizeUrl(raw){
  let url = raw.trim();
  if(!url) return '';
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url;
}

function faviconForUrl(url){
  try{
    const host = new URL(url).hostname;
    return `https://www.google.com/s2/favicons?sz=64&domain=${host}`;
  } catch(e){ return ''; }
}

function renderLinks(){
  if(!tmLinks.length){
    $('#tm-links').innerHTML = '<div class="empty-note">ยังไม่มีลิงก์ เพิ่มลิงก์ที่เกี่ยวข้องได้เลย</div>';
    return;
  }
  $('#tm-links').innerHTML = tmLinks.map((l,i)=>`
    <div class="link-item">
      <img class="link-favicon" src="${escapeHtml(l.icon || faviconForUrl(l.url))}" alt="" title="แตะเพื่ออัปโหลดไอคอนเอง" data-idx="${i}" onerror="this.style.display='none'">
      <a href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(l.label || l.url)}</a>
      <button type="button" class="link-remove-btn" data-idx="${i}" title="ลบลิงก์">✕</button>
    </div>
  `).join('');
  $all('.link-favicon').forEach(img=>{
    img.addEventListener('click', ()=>{
      const idx = parseInt(img.dataset.idx, 10);
      requestIconUpload((dataUrl)=>{
        tmLinks[idx] = { ...tmLinks[idx], icon: dataUrl };
        renderLinks();
        updateTaskField('links', tmLinks);
        showToast('อัปเดตไอคอนแล้ว ✓');
      });
    });
  });
  $all('.link-remove-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      tmLinks.splice(idx, 1);
      renderLinks();
      updateTaskField('links', tmLinks);
    });
  });
}

  currentNotesCache = notes || [];

    $('#tm-notes').innerHTML = '<div class="empty-note">ยังไม่มีโน้ต เพิ่มอัปเดตแรกได้เลย</div>';

          <span class="note-date">${fmtDateTime(n.created_at)}</span>
        </div>
      </div>
      <div class="note-content" data-note-id="${n.id}">${escapeHtml(n.content)}</div>

  `).join('');

function startNoteEdit(noteId){
  const item = document.querySelector(`.note-item[data-note-id="${noteId}"]`);
  const note = currentNotesCache.find(n=>String(n.id)===String(noteId));
  if(!item || !note) return;
  const contentEl = item.querySelector('.note-content');
  contentEl.outerHTML = `
    <div class="note-edit-wrap">
      <textarea class="note-edit-textarea">${escapeHtml(note.content)}</textarea>
      <div class="note-edit-actions">
        <button type="button" class="note-edit-cancel">ยกเลิก</button>
        <button type="button" class="note-edit-save">บันทึก</button>
      </div>
    </div>
  `;
  const wrap = item.querySelector('.note-edit-wrap');
  wrap.querySelector('.note-edit-cancel').addEventListener('click', ()=> renderNotes(currentNotesCache));
  wrap.querySelector('.note-edit-save').addEventListener('click', async ()=>{
    const newContent = wrap.querySelector('.note-edit-textarea').value.trim();
    if(!newContent) return;
    const { error } = await sb.from('task_notes').update({content:newContent}).eq('id', noteId);
    if(error){ showToast('แก้ไขโน้ตไม่สำเร็จ: '+error.message); return; }
    const { data } = await sb.from('task_notes').select('*').eq('task_id', activeTaskId).order('created_at',{ascending:false});
    renderNotes(data);
    if(data && data.length) latestNoteByTask[activeTaskId] = data[0];
    if(currentView==='work') renderWorkLists();
    else if(currentView==='home') renderHome();
    showToast('แก้ไขโน้ตแล้ว ✓');
  });
}

// ---------- HOME ANALYTICS HELPERS ----------
function computePeriodDelta(){
  if(homeRange==='all') return null;
  const now = new Date();
  let curStart, curEnd, prevStart, prevEnd;
  if(homeRange==='month'){
    curStart = new Date(now.getFullYear(), now.getMonth(), 1);
    curEnd = new Date(now.getFullYear(), now.getMonth()+1, 1);
    prevStart = new Date(now.getFullYear(), now.getMonth()-1, 1);
    prevEnd = curStart;
  } else {
    const q = Math.floor(now.getMonth()/3);
    curStart = new Date(now.getFullYear(), q*3, 1);
    curEnd = new Date(now.getFullYear(), q*3+3, 1);
    prevStart = new Date(now.getFullYear(), q*3-3, 1);
    prevEnd = curStart;
  }
  const countIn = (s,e)=> tasksCache.filter(t=> t.status==='เสร็จแล้ว' && t.completed_at && new Date(t.completed_at)>=s && new Date(t.completed_at)<e).length;
  const cur = countIn(curStart, curEnd);
  const prev = countIn(prevStart, prevEnd);
  let delta;
  if(prev===0) delta = cur>0 ? 100 : 0;
  else delta = Math.round(((cur-prev)/prev)*100);
  return { cur, prev, delta };
}

function computeDeadlineCompliance(){
  const withDeadline = tasksCache.filter(t=> t.status==='เสร็จแล้ว' && t.completed_at && (t.deadline_at_completion || t.deadline));
  if(!withDeadline.length) return null;
  let onTime = 0;
  withDeadline.forEach(t=>{
    const dl = t.deadline_at_completion || t.deadline;
    const completedDate = new Date(t.completed_at); completedDate.setHours(0,0,0,0);
    const deadlineDate = new Date(dl); deadlineDate.setHours(0,0,0,0);
    if(completedDate <= deadlineDate) onTime++;
  });
  return { rate: Math.round((onTime/withDeadline.length)*100), onTime, total: withDeadline.length };
}

function computeHighImpactRate(){
  const highImpact = tasksCache.filter(t=>t.impact==='สูง');
  if(!highImpact.length) return null;
  const done = highImpact.filter(t=>t.status==='เสร็จแล้ว').length;
  return { rate: Math.round((done/highImpact.length)*100), done, total: highImpact.length };
}

function computeMonthlyTrend(monthsBack){
  const now = new Date();
  const buckets = [];
  for(let i=monthsBack-1; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    buckets.push({ key: d.getFullYear()+'-'+d.getMonth(), label: d.toLocaleDateString('th-TH',{month:'short',year:'2-digit'}), count:0 });
  }
  tasksCache.forEach(t=>{
    if(t.status==='เสร็จแล้ว' && t.completed_at){
      const d = new Date(t.completed_at);
      const key = d.getFullYear()+'-'+d.getMonth();
      const b = buckets.find(x=>x.key===key);
      if(b) b.count++;
    }
  });
  return { labels: buckets.map(b=>b.label), data: buckets.map(b=>b.count) };
}

function renderTrendChart(){
  const canvas = document.getElementById('trend-chart');
  if(!canvas || typeof Chart==='undefined') return;
  const { labels, data } = computeMonthlyTrend(6);
  if(trendChartInstance){ trendChartInstance.destroy(); trendChartInstance = null; }
  trendChartInstance = new Chart(canvas, {
    type:'bar',
    data:{ labels, datasets:[{ label:'งานที่เสร็จ', data, backgroundColor:'#7C6FFF', borderRadius:6, maxBarThickness:36 }] },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:(ctx)=> ctx.parsed.y + ' งาน' } } },
      scales:{
        y:{ beginAtZero:true, ticks:{ stepSize:1, precision:0, color:'#8A84A0' }, grid:{ color:'#E3E0F5' } },
        x:{ ticks:{ color:'#8A84A0' }, grid:{ display:false } }
      }
    }
  });
}

function exportSummaryCSV(){
  const rangeStart = getRangeStart();
  const list = tasksCache.filter(t=>{
    if(!rangeStart) return true;
    const refDate = t.status==='เสร็จแล้ว' ? t.completed_at : t.created_at;
    return refDate && new Date(refDate) >= rangeStart;
  });
  const rows = [['ชื่องาน','หมวดหมู่','สถานะ','urgency','Impact','Deadline','วันที่เสร็จ','วันที่สร้าง']];
  list.forEach(t=> rows.push([
    t.title, t.category, t.status, t.urgency, t.impact,
    t.deadline || '', t.completed_at ? fmtDate(t.completed_at) : '', fmtDate(t.created_at)
  ]));
  const csv = rows.map(r=> r.map(v=> `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `DoWork-summary-${homeRange}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('ดาวน์โหลดสรุปแล้ว 📄');
}

function impactBarsHtml(list){
  if(!list.length) return '<div class="empty-note">ยังไม่มีข้อมูลในช่วงนี้</div>';
  const levels = ['สูง','กลาง','ต่ำ'];
  const colors = { 'สูง':'var(--purple)', 'กลาง':'var(--yellow)', 'ต่ำ':'var(--mint)' };
  const max = Math.max(...levels.map(l=> list.filter(t=>t.impact===l).length), 1);
  return levels.map(l=>{
    const c = list.filter(t=>t.impact===l).length;
    return `<div class="bar-row">
      <div class="bar-label"><span>${l}</span><span>${c}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(c/max)*100}%;background:${colors[l]};"></div></div>
    </div>`;
  }).join('');
}

function categoryBarsHtml(list){
  if(!list.length) return '<div class="empty-note">ยังไม่มีข้อมูลในช่วงนี้</div>';
  const counts = {};
  list.forEach(t=> counts[t.category] = (counts[t.category]||0)+1);
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max = Math.max(...entries.map(e=>e[1]), 1);
  return entries.map(([cat,c])=>`
    <div class="bar-row">
      <div class="bar-label"><span>${escapeHtml(cat)}</span><span>${c}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(c/max)*100}%;background:var(--pink);"></div></div>
    </div>
  `).join('');
}

function upcomingListHtml(){
  const list = tasksCache.filter(t=>t.status!=='เสร็จแล้ว' && t.deadline).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).slice(0,5);
  if(!list.length) return '<div class="empty-note">ไม่มีงานที่ใกล้ครบกำหนด</div>';
  return `<div class="mini-list">${list.map(t=>`
    <div class="mini-item" data-id="${t.id}">
      ${moodDot(t)}
      <span class="mtitle">${escapeHtml(t.title)}</span>
      <span class="mmeta ${isOverdue(t)?'overdue':''}">${fmtDate(t.deadline)}</span>
    </div>
  `).join('')}</div>`;
}

function recentDoneListHtml(){
  const list = tasksCache.filter(t=>t.status==='เสร็จแล้ว' && t.completed_at).sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at)).slice(0,5);
  if(!list.length) return '<div class="empty-note">ยังไม่มีงานที่เสร็จ</div>';
  return `<div class="mini-list">${list.map(t=>`
    <div class="mini-item" data-id="${t.id}">
      ${moodDot(t)}
      <span class="mtitle">${escapeHtml(t.title)}</span>
      <span class="mmeta">${fmtDate(t.completed_at)}</span>
    </div>
  `).join('')}</div>`;
}

// ---------- RENDER: SETTINGS VIEW ----------
function renderSettings(){
  const el = $('#settings-view');
  el.innerHTML = `
    <div class="view-header">
      <div><h1>Settings</h1><div class="view-sub">จัดการหมวดหมู่งานและบัญชีของคุณ</div></div>
    </div>

    <div class="settings-panel">
      <h3>หมวดหมู่งาน</h3>
      <p class="settings-sub">แก้ชื่อ ลบ หรือเพิ่มหมวดหมู่ใหม่ได้ตามต้องการ (แก้ชื่อจะอัปเดตงานเดิมที่ใช้หมวดนี้ให้ด้วย)</p>
      <div id="cat-list"></div>
      <div class="cat-add-row">
        <input type="text" id="cat-new-input" placeholder="เพิ่มหมวดหมู่ใหม่...">
        <button type="button" id="cat-add-btn">เพิ่ม</button>
      </div>
    </div>

    <div class="settings-panel">
      <h3>เปลี่ยนรหัสผ่าน</h3>
      <p class="settings-sub">ตั้งรหัสผ่านใหม่สำหรับบัญชี ${escapeHtml(currentUser.email)}</p>
      <form id="pw-form">
        <div class="form-row">
          <label>รหัสผ่านใหม่</label>
          <input type="password" id="pw-new" minlength="6" required placeholder="อย่างน้อย 6 ตัวอักษร">
        </div>
        <div class="form-row">
          <label>ยืนยันรหัสผ่านใหม่</label>
          <input type="password" id="pw-confirm" minlength="6" required placeholder="พิมพ์อีกครั้ง">
        </div>
        <div id="pw-message"></div>
        <button type="submit" class="btn-primary">บันทึกรหัสผ่านใหม่</button>
      </form>
    </div>
  `;
  renderCatList();

  $('#cat-add-btn').addEventListener('click', ()=>{
    const input = $('#cat-new-input');
    const val = input.value.trim();
    if(!val) return;
    if(userCategories.includes(val)){ showToast('มีหมวดหมู่นี้อยู่แล้ว'); return; }
    saveCategories([...userCategories, val]);
    input.value = '';
    renderCatList();
    showToast('เพิ่มหมวดหมู่แล้ว');
  });

  $('#pw-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const pw1 = $('#pw-new').value, pw2 = $('#pw-confirm').value;
    $('#pw-message').innerHTML = '';
    if(pw1 !== pw2){ $('#pw-message').innerHTML = '<div class="auth-error">รหัสผ่านไม่ตรงกัน</div>'; return; }
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if(error){ $('#pw-message').innerHTML = `<div class="auth-error">${escapeHtml(error.message)}</div>`; return; }
    $('#pw-message').innerHTML = '<div class="auth-hint">เปลี่ยนรหัสผ่านสำเร็จแล้ว ✓</div>';
    $('#pw-form').reset();
  });
}

function renderCatList(){
  $('#cat-list').innerHTML = userCategories.map((c,i)=>`
    <div class="cat-row" data-idx="${i}" data-cat-name="${escapeHtml(c)}" draggable="true">
      <span class="cat-drag-handle" title="ลากเพื่อจัดลำดับ">⠿</span>
      <input type="color" class="cat-color-input" value="${colorForCategory(c)}" data-cat="${escapeHtml(c)}">
      <input type="text" value="${escapeHtml(c)}" data-orig="${escapeHtml(c)}">
      <button type="button" class="cat-icon-btn cat-delete" title="ลบ">🗑</button>
    </div>
  `).join('');
  wireCategoryDragAndDrop();

  $all('.cat-color-input').forEach(inp=>{
    inp.addEventListener('input', (e)=> saveCategoryColor(e.target.dataset.cat, e.target.value));
  });

  $all('.cat-row input[type=text]').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const newVal = e.target.value.trim();
      const oldVal = e.target.dataset.orig;
      if(!newVal || newVal===oldVal) { e.target.value = oldVal; return; }
      const idx = userCategories.indexOf(oldVal);
      if(idx===-1) return;
      const updated = [...userCategories];
      updated[idx] = newVal;
      await saveCategories(updated);
      if(categoryColors[oldVal]){
        const newColors = {...categoryColors};
        newColors[newVal] = newColors[oldVal];
        delete newColors[oldVal];
        categoryColors = newColors;
        await sb.from('app_settings').update({ category_colors: categoryColors }).eq('user_id', currentUser.id);
      }
      const { error } = await sb.from('tasks').update({category:newVal}).eq('user_id',currentUser.id).eq('category',oldVal);
      if(!error){
        tasksCache.forEach(t=>{ if(t.category===oldVal) t.category = newVal; });
        showToast('อัปเดตหมวดหมู่แล้ว');
      }
      e.target.dataset.orig = newVal;
      renderCatList();
    });
  });

  $all('.cat-delete').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = btn.closest('.cat-row');
      const val = row.querySelector('input[type=text]').dataset.orig;
      if(!confirm(`ลบหมวดหมู่ "${val}" ออกจากรายการ? (งานเดิมที่ใช้หมวดนี้จะยังอยู่ ไม่หาย)`)) return;
      saveCategories(userCategories.filter(c=>c!==val));
      renderCatList();
      showToast('ลบหมวดหมู่แล้ว');
    });
  });
}

let catDragSrcName = null;
function wireCategoryDragAndDrop(){
  $all('.cat-row').forEach(row=>{
    row.addEventListener('dragstart', (e)=>{
      // don't start a row-drag if the user is interacting with an input/button
      if(e.target.closest('input') || e.target.closest('button')){ e.preventDefault(); return; }
      catDragSrcName = row.dataset.catName;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', row.dataset.catName); }catch(err){}
    });
    row.addEventListener('dragend', ()=>{
      row.classList.remove('dragging');
      $all('.cat-row').forEach(r=>r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(row.dataset.catName === catDragSrcName) return;
      row.classList.add('drag-over');
      e.dataTransfer.dropEffect = 'move';
    });
    row.addEventListener('dragleave', ()=> row.classList.remove('drag-over'));
    row.addEventListener('drop', async (e)=>{
      e.preventDefault();
      row.classList.remove('drag-over');
      const targetName = row.dataset.catName;
      if(!catDragSrcName || catDragSrcName === targetName) return;
      const reordered = [...userCategories];
      const srcIdx = reordered.indexOf(catDragSrcName);
      const targetIdx = reordered.indexOf(targetName);
      if(srcIdx===-1 || targetIdx===-1) return;
      reordered.splice(srcIdx, 1);
      reordered.splice(reordered.indexOf(targetName), 0, catDragSrcName);
      catDragSrcName = null;
      await saveCategories(reordered);
      renderCatList();
      showToast('จัดลำดับหมวดหมู่แล้ว');
    });
  });
}
